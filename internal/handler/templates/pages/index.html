{{define "content"}}
<div class="inner">
  <h1>Worksheets</h1>
  <p class="lede">Copy each model on the ruled line beneath it. Write with the Apple Pencil; scroll with two fingers.</p>
  <ol class="sheet-list">
    {{- range .Sheets}}
    <li>
      <a href="/sheet/{{.Slug}}">
        <span class="sheet-title">{{.Title}}</span>
        <span class="sheet-sample">{{index .Lines 0}}</span>
      </a>
    </li>
    {{- end}}
    <li class="own">
      <a href="/practice/new">
        <span class="sheet-title">Your own text</span>
        <span class="sheet-sample">type or paste anything…</span>
      </a>
    </li>
  </ol>
</div>
{{end}}
