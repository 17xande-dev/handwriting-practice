{{define "content"}}
<form class="toolbar" id="toolbar" aria-label="Pen and paper settings">
  <div class="inner toolbar-inner">
    <fieldset class="tiles">
      <legend>Pen</legend>
      <label class="tile">
        <input type="radio" name="pen" value="monoline" checked>
        <svg class="tile-art" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M8 32 L12 22 L28 6 L34 12 L18 28 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M8 32 L12 22 L18 28 Z" fill="currentColor"/>
          <path d="M24 10 L30 16" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span class="tile-label">Monoline</span>
      </label>
      <label class="tile">
        <input type="radio" name="pen" value="edged">
        <svg class="tile-art" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M14 6 L26 6 L27 20 L23 34 L17 34 L13 20 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M17 34 L23 34 L22 29 L18 29 Z" fill="currentColor"/>
          <path d="M20 14 L20 26" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="20" cy="13" r="1.8" fill="currentColor"/>
        </svg>
        <span class="tile-label">Edged nib</span>
      </label>
    </fieldset>

    <figure class="preview">
      <canvas id="pen-preview" aria-hidden="true"></canvas>
      <figcaption>Your pen</figcaption>
    </figure>

    <label class="toggle">
      <input type="checkbox" name="finger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11 V5 a1.5 1.5 0 0 1 3 0 V10 M12 10 V4 a1.5 1.5 0 0 1 3 0 V10 M15 10 V6 a1.5 1.5 0 0 1 3 0 V14 c0 4 -2.5 7 -6.5 7 c-3 0 -4.5 -1.5 -6 -4 L3.5 13 a1.5 1.5 0 0 1 2.5 -1.5 L9 14 V11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span>Finger draws</span>
    </label>

    <div class="sliders">
      <label class="slider" data-pen="monoline">
        <span class="slider-name">Weight</span>
        <svg class="slider-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 L20 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="range" name="weight" min="1" max="5" step="0.5" value="3">
        <svg class="slider-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 L19 5" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
      </label>
      <label class="slider" data-pen="edged" hidden>
        <span class="slider-name">Nib</span>
        <svg class="slider-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L15 4 L15 20 L9 20 Z" fill="currentColor"/></svg>
        <!-- Right is wider: the value is nib widths per x-height, so the range runs reversed. -->
        <input class="reversed" type="range" name="nibs" min="3" max="8" step="0.5" value="5">
        <svg class="slider-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4 L19 4 L19 20 L5 20 Z" fill="currentColor"/></svg>
        <output name="nibsOut">5 nibs</output>
      </label>
      <label class="slider" data-pen="edged" hidden>
        <span class="slider-name">Angle</span>
        <input type="range" name="angle" min="0" max="90" step="5" value="45">
        <svg class="slider-end dial" viewBox="-12 -12 24 24" aria-hidden="true">
          <line x1="-11" y1="0" x2="11" y2="0" stroke="currentColor" stroke-width="0.75" stroke-dasharray="2 2"/>
          <line id="angle-nib" x1="-9" y1="0" x2="9" y2="0" stroke="currentColor" stroke-width="3" stroke-linecap="round" transform="rotate(-45)"/>
        </svg>
        <output name="angleOut">45°</output>
      </label>
      <label class="slider">
        <span class="slider-name">Size</span>
        <span class="slider-end size-small" aria-hidden="true">a</span>
        <input type="range" name="xh" min="20" max="60" step="2" value="32">
        <span class="slider-end size-large" aria-hidden="true">a</span>
      </label>
    </div>

  </div>
</form>

<!-- The model font is chosen here rather than in the sticky toolbar: there
     are too many to fit there, and it is rarely changed mid-line. First a
     family, then one of its variants. The variant radios belong to the
     toolbar form through form="toolbar"; the family tiles are only a way of
     choosing among them, so they aren't part of the form. -->
<section class="models inner" aria-labelledby="models-heading">
  <h2 id="models-heading">Model</h2>
  <div class="family-tiles" role="radiogroup" aria-label="Font family">
    {{- range .Groups}}
    <label class="tile">
      <input type="radio" name="family" value="{{.Name}}">
      <span class="tile-art font-{{(index .Fonts 0).ID}}" aria-hidden="true">an</span>
      <span class="tile-label">{{.Name}}</span>
    </label>
    {{- end}}
    <label class="tile">
      <input type="radio" name="family" value="Google Fonts">
      <span class="tile-art custom-art" id="custom-art" aria-hidden="true">Aa</span>
      <span class="tile-label">Google Fonts</span>
    </label>
  </div>
  <div class="variant-chips" role="radiogroup" aria-label="Variant">
    {{- range .Groups}}{{range .Fonts}}
    <label class="chip" data-group="{{.Group}}">
      <input type="radio" form="toolbar" name="model" value="{{.ID}}" data-group="{{.Group}}" data-slant="{{.Slant}}"{{if .Italic}} data-style="italic"{{end}}{{if eq .ID $.Default}} checked{{end}}>
      <span class="chip-name font-{{.ID}}">{{.Variant}}</span>
      <span class="chip-note">{{.Note}}</span>
    </label>
    {{- end}}{{end}}
    <!-- Google Fonts has no chips: its family tile selects this, and the
         panel below names the font. -->
    <input class="custom-model" type="radio" form="toolbar" name="model" value="custom" data-group="Google Fonts" tabindex="-1" aria-hidden="true">
  </div>
  <div class="custom-font" data-model="custom" hidden>
    <label class="field">Google Fonts family
      <input type="text" form="toolbar" name="customFont" id="custom-font" maxlength="64"
        autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false"
        placeholder="e.g. Caveat">
    </label>
    <button type="button" id="custom-font-load">Load</button>
    <label class="slider">
      <span class="slider-name">Slant</span>
      <input type="range" form="toolbar" name="customSlant" min="-20" max="30" step="0.5" value="0">
      <output id="custom-slant-out">0°</output>
    </label>
    <p class="custom-status" id="custom-font-status" role="status"></p>
  </div>
</section>

<div class="inner writing-area" id="writing-area">
  <h1>{{.Sheet.Title}}</h1>
  <p class="lede">{{.Sheet.Note}}</p>

  <ol class="rows" id="rows">
    {{- range $i, $line := .Sheet.Lines}}
    <li class="row">
      <div class="band reference">
        <canvas aria-hidden="true"></canvas>
        <p class="model">{{$line}}</p>
      </div>
      <div class="band practice">
        <canvas aria-label="Practice line {{inc $i}}: copy “{{$line}}”"></canvas>
      </div>
      <div class="row-actions">
        <button type="button" data-action="undo" disabled>Undo</button>
        <button type="button" data-action="clear" disabled>Clear</button>
      </div>
    </li>
    {{- end}}
  </ol>
  <div class="back">
    {{- if .Custom}}
    <form method="post" action="/practice/new">
      <input type="hidden" name="text" value="{{.Text}}">
      <button type="submit">Edit this text</button>
    </form>
    {{- end}}
    <a href="/">All worksheets</a>
  </div>
</div>
{{end}}
