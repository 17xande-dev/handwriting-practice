services:
  server:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ADDR: ":8080"
      # Accounts and synced history. On the named volume below, so a redeploy
      # keeps it; the image's /data is owned by the nonroot user it runs as.
      # Daily VACUUM INTO backups land beside it, in /data/backups.
      DB_PATH: /data/handwriting.db
      # Set to 1 once the site is served over https (the reverse proxy's
      # certificate). Never over plain HTTP: it pins the browser to https.
      HSTS: "${HSTS:-0}"
      # Behind a reverse proxy every connection comes from the proxy, so the
      # per-IP sign-in limit would be one bucket shared by everyone. Name the
      # header your proxy sets. Prefer a single-value one the proxy overwrites
      # (CF-Connecting-IP, X-Real-IP); for X-Forwarded-For only its rightmost
      # entry, the one your own proxy appended, is used.
      # Empty (the default) uses the connection's own address. Only set it when
      # every request really arrives through that proxy.
      CLIENT_IP_HEADER: "${CLIENT_IP_HEADER:-}"
    # argon2id holds 64 MiB per sign-in, at most three at a time.
    mem_limit: 512m
    volumes:
      - data:/data
    healthcheck:
      # The runtime image is distroless (no shell, no wget), so the binary
      # probes itself.
      test: ["CMD", "/calligraphy", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  data:
